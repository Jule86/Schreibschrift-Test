function resize(){const r=img.getBoundingClientRect();if(!r.width||!r.height)return;const ratio=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(r.width*ratio);canvas.height=Math.round(r.height*ratio);redraw()}
function show(){img.onload=()=>{resize()};img.src=images[index];$('page').textContent='Seite '+(index+2)+' von 4';$('prev').disabled=index===0;$('next').disabled=index===2;resize()}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();drawing=true;canvas.setPointerCapture(e.pointerId);current={points:[coords(e)],color:$('color').value,width:Number($('size').value),erase:mode==='erase'};redraw()});canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();current.points.push(coords(e));redraw()});function finish(e){if(!drawing)return;drawing=false;if(current){strokes[index].push(current);current=null}redraw()}canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);
$('prev').onclick=()=>{if(index>0){index--;show()}};$('next').onclick=()=>{if(index<2){index++;show()}};function setMode(m){mode=m;$('pen').classList.toggle('active',m==='pen');$('eraser').classList.toggle('active',m==='erase')}$('pen').onclick=()=>setMode('pen');$('eraser').onclick=()=>setMode('erase');$('undo').onclick=()=>{strokes[index].pop();redraw()};$('clear').onclick=()=>{if(confirm('Alle Eintragungen auf dieser Seite löschen?')){strokes[index]=[];redraw()}};
$('save').onclick=()=>{const out=document.createElement('canvas');out.width=img.naturalWidth;out.height=img.naturalHeight;const c=out.getContext('2d');c.drawImage(img,0,0,out.width,out.height);const overlay=document.createElement('canvas');overlay.width=out.width;overlay.height=out.height;const oc=overlay.getContext('2d');for(const s of strokes[index]){const c=oc;c.save();c.globalCompositeOperation=s.erase?'destination-out':'source-over';c.strokeStyle=s.color;c.lineWidth=s.width*out.width/1100;c.lineCap='round';c.lineJoin='round';c.beginPath();s.points.forEach((p,i)=>{if(i)c.lineTo(p.x*out.width,p.y*out.height);else c.moveTo(p.x*out.width,p.y*out.height)});c.stroke();c.restore()}c.drawImage(overlay,0,0);const a=document.createElement('a');a.download='Schreibuebung-Seite-'+(index+2)+'.png';a.href=out.toDataURL('image/png');document.body.append(a);a.click();a.remove()};new ResizeObserver(resize).observe($('paper'));show();
</script></body></html>
